<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f"><meta name="color-scheme" content="dark">

<title>Cartelera</title>
<link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/logo.svg"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

<style>
:root{--bg:#07060f;--tx:#f6f4ff;--mut:#b0abc9;--ok:#4ee3a8;--warn:#ffb74a;--gold:#ffd166;--a1:#ff4d6a;--a2:#ff8a5c;
 --gbg:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 46%,rgba(255,255,255,.1));--gbd:rgba(255,255,255,.18);
 --spring:cubic-bezier(.2,1.25,.35,1);--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
#amb{position:fixed;inset:-25%;z-index:-1;pointer-events:none;will-change:transform;
 background:radial-gradient(38% 32% at 20% 14%,#6a3df09e,transparent 70%),radial-gradient(34% 28% at 86% 8%,#ff4d6a7a,transparent 70%),radial-gradient(44% 34% at 72% 86%,#2b7de97a,transparent 70%),radial-gradient(30% 28% at 8% 78%,#ffb34752,transparent 70%);
 animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.1) rotate(4deg)}}
.wrap{max-width:920px;margin:0 auto}

/* ===== Liquid Glass ===== */
.glass{position:relative;isolation:isolate;background:var(--gbg);border:1px solid var(--gbd);
 backdrop-filter:blur(22px) saturate(1.9);-webkit-backdrop-filter:blur(22px) saturate(1.9);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 .5px rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.28),0 10px 32px rgba(0,0,0,.4)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(130% 75% at 10% 0%,rgba(255,255,255,.26),transparent 55%)}
.lite{backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6)}
.tint{background:linear-gradient(150deg,rgba(255,96,116,.82),rgba(255,138,92,.62));border-color:rgba(255,205,190,.55)}
.tint.ok{background:linear-gradient(150deg,rgba(60,214,160,.75),rgba(40,170,130,.5));border-color:rgba(170,255,220,.5);color:#03231a}
.tint.warn{background:linear-gradient(150deg,rgba(255,183,74,.5),rgba(255,140,60,.28));border-color:rgba(255,215,150,.5);color:var(--tx)}
.press{transition:transform .45s var(--spring),filter .2s;cursor:pointer}.press:active{transform:scale(.95);transition-duration:.08s}

/* ===== Cabecera ===== */
.top{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 14px 10px;
 background:linear-gradient(rgba(7,6,15,.92),rgba(7,6,15,.55) 70%,transparent);
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.brandrow{display:flex;align-items:center;gap:10px;height:42px;margin-bottom:10px;overflow:hidden;transition:height .35s var(--spring),margin .35s,opacity .25s}
.top.sm .brandrow{height:0;margin:0;opacity:0}
.brandrow img{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px #0008}.brandrow b{font-size:25px;letter-spacing:-.035em;font-weight:800}.brandrow b i{font-style:normal;color:var(--gold)}
.search{display:flex;align-items:center;gap:9px;border-radius:18px;padding:0 8px 0 15px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:17px;padding:13px 0;-webkit-appearance:none}.search input::placeholder{color:var(--mut)}
.search input::-webkit-search-cancel-button{display:none}
.x{border:0;background:rgba(255,255,255,.16);color:var(--tx);width:26px;height:26px;border-radius:50%;font-size:13px;display:none}.search.has .x{display:block}

/* ===== Secciones ===== */
h2{margin:22px 16px 10px;font-size:21px;letter-spacing:-.025em;font-weight:760;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2 small{font-size:13px;color:var(--mut);font-weight:500;letter-spacing:0}
.rail{display:flex;gap:13px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x proximity;scroll-padding-left:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 134px;scroll-snap-align:start}
.card .p{position:relative;aspect-ratio:2/3;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.07);box-shadow:0 12px 28px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.14)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{margin:8px 4px 0;font-size:13.5px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card .y{margin:1px 4px 0;font-size:12px;color:var(--mut)}
.rate{position:absolute;left:7px;bottom:7px;border-radius:11px;padding:3px 9px;font-size:12px;font-weight:750;color:var(--gold);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px 13px;padding:0 16px}.grid .card{flex:none}
.pad{padding:0 16px}.mut{color:var(--mut)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.empty{padding:34px 24px;text-align:center;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.seg{display:flex;gap:8px;padding:2px 16px 8px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:99px;font-size:14px;font-weight:650;color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.25);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6)}
.chip img{width:20px;height:20px;border-radius:6px;vertical-align:-5px;margin-right:7px}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:8px 16px 8px 8px;border-radius:20px;font-weight:700;font-size:14.5px}
.pill.mine{border-color:rgba(255,160,120,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,138,92,.45),0 8px 24px rgba(255,100,80,.25)}
.pill img,.pill i{width:36px;height:36px;border-radius:11px;object-fit:cover;background:rgba(255,255,255,.12);display:grid;place-items:center;font-style:normal;flex:none}
.pill em{font-style:normal;color:var(--warn);margin-left:-3px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin:9px 16px;border-radius:22px}
.row b{font-weight:680}.row small{color:var(--mut)}
.btn{border:0;border-radius:15px;padding:11px 17px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap;text-decoration:none;display:inline-block}
.star{font-size:24px;background:none;border:0;color:var(--gold);padding:6px}
select{color:var(--tx);border-radius:14px;padding:10px 12px;font-size:16px;border:1px solid var(--gbd);background:rgba(255,255,255,.12)}
.note{margin:10px 16px;padding:12px 15px;border-radius:18px;font-size:13.5px;color:var(--tx)}
.sk{flex:0 0 134px;height:201px;border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.06) 30%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.06) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.up{display:flex;gap:13px;align-items:center;padding:11px 13px;margin:9px 16px;border-radius:22px}.up img{width:58px;height:87px;object-fit:cover;border-radius:12px;flex:none;background:rgba(255,255,255,.08)}
.up b{display:block;line-height:1.25;font-weight:680}.dt{flex:none;width:50px;text-align:center;font-weight:800;line-height:1.05}.dt small{display:block;color:var(--a2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}

.on{position:absolute;right:6px;bottom:6px;display:flex;gap:3px}.on img{width:21px;height:21px;border-radius:7px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.35)}
.unv{position:absolute;top:7px;right:7px;border-radius:9px;padding:1px 8px;font-size:13px;font-weight:800;color:var(--warn)}
.cb{margin:10px 16px;padding:14px;border-radius:24px}.cbh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.cbh small{color:var(--mut)}
.mv{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.1)}.mvp{flex:0 0 58px;height:87px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.08)}.mvp img{width:100%;height:100%;object-fit:cover;display:block}
.mvb{min-width:0;flex:1}.mvb>b{display:block;font-weight:700;line-height:1.25;margin-bottom:5px}.vs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:3px 0}.vs small{color:var(--mut);font-size:12px;min-width:56px}
.tm{display:inline-flex;align-items:baseline;gap:5px;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.1);color:var(--tx);text-decoration:none;font-weight:750;font-size:14px;border:1px solid rgba(255,255,255,.14)}
.tm.win{background:linear-gradient(150deg,rgba(60,214,160,.55),rgba(40,170,130,.32));border-color:rgba(170,255,220,.5)}.tm i{font-style:normal;font-weight:600;font-size:10px;color:var(--mut)}
/* ===== Dock =====
.dock{background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04)),rgba(12,10,28,.5);position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,480px);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:32px;z-index:30}
.dock .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.35);transition:transform .55s var(--spring)}
.dock button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px 8px;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:700;transition:color .25s,transform .45s var(--spring)}
.dock button{text-shadow:0 1px 6px rgba(0,0,0,.6)}.dock button span{font-size:21px;line-height:1.1}.dock button.on{color:var(--tx)}.dock button:active{transform:scale(.9)}

/* ===== Hojas (ficha, plataforma) ===== */
.sheet{position:fixed;inset:0;z-index:50;overflow:auto;overscroll-behavior:contain;background:var(--bg);animation:up .5s var(--spring)}
.sheet.out{animation:down .28s cubic-bezier(.4,0,1,1) forwards}@keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}
.sheet .bgimg{position:fixed;inset:-10%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.7) brightness(.6);z-index:-1}
.close{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:60;width:42px;height:42px;border-radius:50%;color:#fff;font-size:18px;display:grid;place-items:center;border:1px solid var(--gbd)}
.hero{position:relative;height:310px;background-size:cover;background-position:center top}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(7,6,15,.1) 35%,rgba(7,6,15,.92))}
.dh{margin:-96px 16px 0;position:relative;z-index:1}.dh h1{margin:0;font-size:32px;letter-spacing:-.035em;line-height:1.08;text-shadow:0 2px 20px #0009}
.meta{color:var(--mut);margin:7px 0 13px;font-size:14px}
.rt{display:flex;flex-wrap:wrap;gap:9px;margin:16px 16px 0}.rt div{border-radius:18px;padding:9px 14px;font-weight:780;font-size:16px}.rt small{display:block;color:var(--mut);font-weight:560;font-size:11px;margin-top:1px}
.verdict{margin:16px 16px 4px;padding:17px 18px;border-radius:24px;font-weight:760;font-size:18px;line-height:1.3}.verdict small{display:block;font-weight:520;font-size:13px;opacity:.78;margin-top:3px}
.opl{width:44px;height:44px;border-radius:13px;object-fit:cover;margin-right:13px;flex:none;background:rgba(255,255,255,.12)}
.syn{margin:0 16px;line-height:1.55;color:#e6e2f6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-transparency:reduce){.glass,.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:#1b1832}}
</style></head><body>
<div id="amb"></div>
<div class="wrap">
<header class="top" id="top"><div class="brandrow"><img src="/static/logo.svg" alt=""><b>Cartel<i>era</i></b></div>
<label class="search glass" id="sb"><span>🔍</span><input id="q" type="search" enterkeyhint="search" placeholder="Busca una peli o serie…" autocomplete="off"><button class="x" id="qx" aria-label="Borrar">✕</button></label></header>
<main id="app"></main></div>
<nav class="dock glass" id="dock"><i class="ind" id="ind"></i>
<button data-t="inicio"><span>🍿</span>Inicio</button><button data-t="peli"><span>🎬</span>Películas</button><button data-t="series"><span>📺</span>Series</button><button data-t="cines"><span>📍</span>Cines</button><button data-t="tu"><span>👤</span>Tú</button></nav>
<script>
"use strict";
/* ---------- datos fijos ---------- */
const PLAT={netflix:"Netflix",prime:"Prime Video",disney:"Disney+",hbo:"Max",apple:"Apple TV",movistar:"Movistar+",skyshowtime:"SkyShowtime",filmin:"Filmin",mubi:"MUBI",crunchyroll:"Crunchyroll",plutotv:"Pluto TV",rakuten:"Rakuten TV"};
const COVERED=new Set(["netflix","prime","disney","hbo","apple","mubi","skyshowtime","crunchyroll","plutotv"]);
const PRESETS=[{id:"p-quad",code:"G01LE",short:"Quadernillos",name:"O-Cine Quadernillos",address:"Alcalá de Henares",website:"https://tickets.ocinequadernillos.es/"},{id:"p-yelmo",code:"E0291",short:"Parque Corredor",name:"Yelmo Parque Corredor",address:"Torrejón de Ardoz",website:"https://www.cineyelmo.com/es"}];
const SORTS={hype:["🔥 Más hype",m=>-m.pop],pop:["⭐ Populares",m=>-m.votes],new:["🆕 Recién estrenadas",m=>m.date,1],rate:["🏆 Mejor valoradas",m=>-m.rating]};
const TABS=["inicio","peli","series","cines","tu"];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],DIA=["dom","lun","mar","mié","jue","vie","sáb"];
/* ---------- utilidades ---------- */
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch{}};
const api=async u=>{const r=await fetch(u);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||("Error "+r.status));return r.json()};
/* stale-while-revalidate: pinta al instante lo último guardado y refresca detrás */
async function swr(u,apply){const k="c:"+u;let had=false;const c=ls(k,null);if(c){had=true;apply(c,true)}
 try{const d=await api(u);sv(k,d);apply(d,false)}catch(e){if(!had)apply(null,false,e.message)}}
const L=x=>Array.isArray(x)?x:Object.assign([],{err:(x&&x.error)||"No disponible ahora mismo"});
const sortBy=(l,m)=>{if(!l||l.err||!SORTS[m])return l;const[,f,desc]=SORTS[m];return[...l].sort((a,b)=>{const x=f(a),y=f(b);return(x<y?-1:x>y?1:0)*(desc?-1:1)})};
/* ---------- estado ---------- */
const S={tab:TABS.includes(ls("tab","inicio"))?ls("tab","inicio"):"inicio",mine:ls("mine",[]),favs:(ls("favs",null)||PRESETS).map(f=>PRESETS.find(p=>p.id==f.id)||f),fsel:ls("fsel",null),br:{},sh:{},shErr:{},shAt:{},showAll:false,hours:ls("hours",[17,21]),
 sort:ls("sort","hype"),usort:"date",upf:"all",q:"",res:null,np:null,tr:null,ser:null,up:null,logos:{},cines:null,cerr:""};
const logo=(id,u)=>u||S.logos[id]||"";
/* ---------- piezas ---------- */
const card=(m,i=9,sub)=>`<div class="card press" data-k="${m.type}" data-i="${m.id}"><div class="p">${m.poster?`<img ${i<4?'fetchpriority="high"':'loading="lazy"'} decoding="async" alt="" src="${esc(m.poster)}">`:""}<span class="rate glass lite">★ ${m.rating||"–"}</span>${m.verified===false?'<span class="unv glass lite" title="Sin enlace verificado">≈</span>':""}${m.on&&m.on.length?`<span class="on">${m.on.slice(0,3).map(k=>logo(k)?`<img alt="" src="${esc(logo(k))}" onerror="this.remove()">`:"").join("")}</span>`:""}</div><div class="t">${esc(m.title)}</div><div class="y">${sub||`${m.year||""} · ${m.type=="tv"?"Serie":"Peli"}`}</div></div>`;
const rail=l=>l==null?`<div class="rail">${'<div class="sk"></div>'.repeat(5)}</div>`:l.err?`<p class="empty">${esc(l.err)}<br><br><button class="btn glass tint press" data-retry="1">Reintentar</button></p>`:`<div class="rail">${l.map((m,i)=>card(m,i)).join("")}</div>`;
const sortbar=(cur,modes=Object.keys(SORTS),attr="sort")=>`<div class="seg">${modes.map(k=>`<span class="chip glass press ${cur==k?"tint":""}" data-${attr}="${k}">${SORTS[k]?SORTS[k][0]:"Relevancia"}</span>`).join("")}</div>`;
const seg=(attr,cur,opts)=>`<div class="seg">${opts.map(([v,t])=>`<span class="chip glass press ${cur==v?"tint":""}" data-${attr}="${v}">${t}</span>`).join("")}</div>`;
const pill=k=>`<div class="pill glass press ${S.mine.includes(k)?"mine":""}" data-pl="${k}">${logo(k)?`<img alt="" src="${esc(logo(k))}" onerror="this.remove()">`:"<i>▶</i>"}${PLAT[k]}${COVERED.has(k)?"":"<em title='Sin enlace verificado'>≈</em>"}</div>`;
const hopt=v=>Array.from({length:15},(_,i)=>i+9).map(h=>`<option value="${h}" ${h==v?"selected":""}>${h}:00</option>`).join("");
const upRow=m=>{const d=new Date(m.date+"T12:00:00");return`<div class="up glass lite press" data-k="${m.type}" data-i="${m.id}"><div class="dt"><small>${DIA[d.getDay()]}</small><span style="font-size:24px">${d.getDate()}</span><small style="color:var(--mut)">${MES[d.getMonth()].slice(0,3)}</small></div>${m.poster?`<img loading="lazy" decoding="async" alt="" src="${esc(m.poster)}">`:""}<div><b>${esc(m.title)}</b><span class="mut" style="font-size:13px">${m.type=="tv"?"Serie":"Película"}${m.pop?` · 🔥 ${Math.round(m.pop)}`:""}</span></div></div>`};
const cineRow=c=>`<div class="row glass lite"><div><b>${esc(c.name)}</b><br><small>${c.km!=null?c.km+" km · ":""}${esc(c.address||"")}</small></div><div style="display:flex;align-items:center;gap:4px">${c.website?`<a class="btn glass tint press" href="${esc(c.website)}" target="_blank" rel="noopener">Cartelera ↗</a>`:""}<button class="star press" data-f="${esc(c.id)}" aria-label="Fijar">${S.favs.some(x=>x.id==c.id)?"★":"☆"}</button></div></div>`;
const sortRes=r=>{const m=S.rsort||"rel";return m=="rel"?r:sortBy(r,m)};
/* ---------- vistas ---------- */
const effSel=()=>S.fsel===null?S.mine:S.fsel;
const BR=k=>S.br[k]||(S.br[k]={order:"hype",items:[],next:null,busy:false,err:"",seq:0,loaded:false});
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const inWin=t=>{const h=+t.slice(0,2)+ +t.slice(3)/60;return h>=S.hours[0]&&h<=S.hours[1]};
/* sesiones de un cine ya filtradas: no empezadas y (salvo "todo el día") dentro de mis horas */
function sessions(d,all){if(!d||!d.movies)return[];const today=d.date==todayStr(),now=nowHM();
 return d.movies.map(m=>({...m,versions:m.versions.map(v=>({...v,times:v.times.filter(t=>(!today||t.t>=now)&&(all||inWin(t.t)))})).filter(v=>v.times.length)})).filter(m=>m.versions.length)}

/* ---------- hojas con historial, arrastrar para cerrar ---------- */
const stack=[];let popping=false;
function openSheet(el){document.body.append(el);stack.push(el);document.body.style.overflow="hidden";history.pushState({s:stack.length},"");dragClose(el)}
function closeSheet(el){if(stack[stack.length-1]===el&&!popping)history.back();else dropSheet(el)}
function dropSheet(el){const i=stack.indexOf(el);if(i<0)return;stack.splice(i,1);el.classList.add("out");if(!stack.length)document.body.style.overflow="";setTimeout(()=>el.remove(),280)}
addEventListener("popstate",()=>{const el=stack[stack.length-1];if(el){popping=true;dropSheet(el);popping=false}});
function dragClose(el){let y0=null,t0=0,dy=0;
 el.addEventListener("touchstart",e=>{if(el.scrollTop<=0&&e.touches.length==1){y0=e.touches[0].clientY;t0=e.timeStamp;dy=0}},{passive:true});
 el.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&el.scrollTop<=0){el.style.transition="none";el.style.transform=`translateY(${dy}px)`}else if(dy<=0){y0=null}},{passive:true});
 el.addEventListener("touchend",e=>{if(y0==null)return;const v=dy/(e.timeStamp-t0+1);y0=null;el.style.transition="transform .4s cubic-bezier(.2,1.25,.35,1)";
  if(dy>140||v>.7){buzz(8);closeSheet(el)}else el.style.transform=""},{passive:true})}

 else if(t.dataset.bp){const v=t.dataset.bp;if(v=="__mine")S.fsel=null;else if(v=="__all")S.fsel=[];else{let c=S.fsel===null?[...S.mine]:[...S.fsel];c=c.includes(v)?c.filter(x=>x!=v):[...c,v];S.fsel=c}sv("fsel",S.fsel);buzz(6);resetBrowse();const k=S.tab=="peli"?"movie":"tv";loadBrowse(k,false)}
 else if(t.dataset.bo){const k=S.tab=="peli"?"movie":"tv";BR(k).order=t.dataset.bo;buzz(6);loadBrowse(k,false)}
 else if(t.dataset.bm){loadBrowse(t.dataset.bm,true)}
 else if(t.dataset.bretry){loadBrowse(t.dataset.bretry,false)}
 else if(t.dataset.sh){S.showAll=t.dataset.sh=="all";buzz(6);render()}
 else if(t.dataset.p){const p=t.dataset.p;S.mine=S.mine.includes(p)?S.mine.filter(x=>x!=p):[...S.mine,p];sv("mine",S.mine);buzz(8);resetBrowse();render()}
 else if(t.dataset.f){const c=(S.cines||[]).concat(S.favs,PRESETS).find(x=>x.id==t.dataset.f);if(!c)return;S.favs=S.favs.some(x=>x.id==c.id)?S.favs.filter(x=>x.id!=c.id):[...S.favs,c];sv("favs",S.favs);buzz(8);render()}
 else if(t.id=="loc"){t.textContent="Buscando…";S.cerr="";navigator.geolocation.getCurrentPosition(async p=>{try{S.cines=await api(`/api/cinemas?lat=${p.coords.latitude}&lon=${p.coords.longitude}&radius_km=12`)}catch(er){S.cerr=er.message}render()},()=>{S.cerr="Sin permiso de ubicación. Actívalo en los ajustes del navegador.";render()},{timeout:10000})}});
document.addEventListener("change",e=>{if(e.target.id=="h0"||e.target.id=="h1"){let a=+$("#h0").value,b=+$("#h1").value;if(b<=a)b=Math.min(23,a+1);S.hours=[a,b];sv("hours",S.hours);render()}});
let tm,seq=0;$("#q").addEventListener("input",e=>{clearTimeout(tm);const q=S.q=e.target.value.trim();$("#sb").classList.toggle("has",!!e.target.value);
 if(q.length<2){S.res=null;render();return}S.res=null;render();const my=++seq;tm=setTimeout(async()=>{try{const r=await api("/api/search?q="+encodeURIComponent(q));if(my==seq)S.res=r}catch(er){if(my==seq)S.res=Object.assign([],{err:er.message})}if(my==seq)render()},280)});
$("#q").addEventListener("keydown",e=>{if(e.key=="Enter")e.target.blur()});
let ticking=false;addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{$("#top").classList.toggle("sm",scrollY>50);ticking=false})},{passive:true});

function loadHome(){swr("/api/home",(d,stale,err)=>{if(!d){S.np=S.tr=Object.assign([],{err});S.ser={popular:S.np,airing:S.np};render();return}S.np=L(d.np);S.tr=L(d.tr);S.ser=d.ser;S.logos=d.logos&&!d.logos.error?d.logos:S.logos;render()})}
function loadUp(cb){if(S.up&&!S.up.err){cb&&cb();return}swr("/api/upcoming",(d,s,err)=>{S.up=d?L(d):Object.assign([],{err});render();cb&&cb()})}
render();loadHome();loadUp();myCines().forEach(c=>loadShow(c.code));if(S.tab=="peli")loadBrowse("movie");if(S.tab=="series")loadBrowse("tv");
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
